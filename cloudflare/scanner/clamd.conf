LocalSocket /tmp/clamd.sock
LocalSocketMode 600
FixStaleSocket yes
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /dev/shm/clamav
User clamav
Foreground yes
LogFileUnlock yes
LogVerbose no
LogTime no
MaxThreads 2
MaxQueue 4
MaxScanTime 12000
StreamMaxLength 5M
MaxFileSize 5M
MaxScanSize 20M
MaxRecursion 8
MaxFiles 100
AlertExceedsMax yes
AlertEncrypted yes
ConcurrentDatabaseReload no
